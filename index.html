<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" src="https://via.placeholder.com/180x180" alt=".">
            <h1 id="name" class="profile-name">Lucas Pecanha</h1>
            <h2 id="username" class="profile-username">@LucasDpecanha</h2>
            <img id="avatar" class="profile-avatar" src="https://via.placeholder.com/180x180" alt=".">
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repos">5</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers">5</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following">5</span>
                </li>
            </ul>
            <a id="link" href="#" class="profile-link">Ver no Github</a>
        </div>
    </header>

    <script>
       document.addEventListener('DOMContentLoaded', function(){
        const nameElement = document.querySelector('#name');
        const usernameElement = document.querySelector('#username');
        const avatarElement = document.querySelector('#avatar');
        const reposElement = document.querySelector('#repos');
        const followersElement = document.querySelector('#followers');
        const followingElement = document.querySelector('#following');
        const linkElement = document.querySelector('#link');

    if (!nameElement || !usernameElement || !avatarElement || !reposElement || !followersElement || !followingElement || !linkElement) {
        console.error("Erro: Um ou mais elementos não foram encontrados no DOM.");
        return;
    }

    fetch('https://api.github.com/users/LucasDpecanha')
    .then(res => res.json())
    .then(json => {
        nameElement.innerText = json.name;
        usernameElement.innerText = json.login;
        avatarElement.src = json.avatar_url;
        followingElement.innerText = json.following;
        followersElement.innerText = json.followers;
        reposElement.innerText = json.public_repos; 
        linkElement.href = json.html_url;
        })
    .catch(error => console.error("Erro ao buscar dados da API:", error));
        });
    </script>
</body>
</html>
